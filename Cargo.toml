[package]
name = "kenshii"
version = "0.2.0"
edition = "2021"
authors = ["Maini Lotfi Abdelkader <mainilotfi@gmail.com>"]
description = "A blazing-fast terminal disk usage analyzer with nested treemaps"
repository = "https://github.com/phantekzy/kenshi"
license = "MIT"
readme = "README.md"
keywords = ["cli", "disk-usage", "terminal", "tui", "analyzer"]
categories = ["command-line-utilities"]

[[bin]]
name = "kenshii"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
clap = { version = "4", features = ["derive"] }
humansize = "2"
